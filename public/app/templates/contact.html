<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Encodage des caractères -->
    <meta charset="UTF-8">

    <!-- Compatibilité avec Internet Explorer -->
    <meta content="IE=edge" http-equiv="X-UA-Compatible">

    <!-- Rendre la page responsive sur mobile -->
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- Description pour le SEO -->
    <meta content="EcoRide est votre partenaire pour des déplacements écologiques, économiques et responsables. Rejoignez une communauté qui partage vos valeurs."
          name="description">

    <!-- Mots-clés pour le SEO (optionnel : certains moteurs de recherche ne s'en servent plus) -->
    <meta content="EcoRide, déplacements écologiques, mobilité durable, voyage responsable" name="keywords">

    <!-- Meta Robots pour indiquer aux moteurs de recherche comment indexer la page -->
    <meta content="index,follow" name="robots">

    <!-- Couleur du thème pour certains navigateurs mobiles -->
    <meta content="#ffffff" name="theme-color">

    <!-- Open Graph pour le partage sur les réseaux sociaux -->
    <meta content="EcoRide - Voyager autrement" property="og:title">
    <meta content="EcoRide est votre partenaire pour des déplacements écologiques, économiques et responsables. Rejoignez une communauté qui partage vos valeurs."
          property="og:description">
    <!-- lien vers le logo -->
    <meta content="..//asset/img/logo.png" property="og:image">
    <!-- URL du site -->
    <meta content="http://127.0.0.1:80/index.html" property="og:url">

    <!-- Favicon pour l'onglet du navigateur -->
    <link href="../asset/img/logo.png" rel="icon" type="image/x-icon">

    <!-- Titre de la page -->
    <title>EcoRide - Voyager autrement</title>

    <!-- Lien vers la police de caracteres Open Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Lien vers la librairie Bootstrap (CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Lien vers la feuille de style personnalisée -->
    <link href="../asset/css/styles.css" rel="stylesheet">

    <!-- Lien vers Font Awesome pour les icônes -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<!-- ================================================= -->
<!-- Barre de navigation (Header) -->
<!-- ================================================= -->
<header>
    <!-- ================================================= -->
    <!-- Import de nav.html -->
    <!-- ================================================= -->
</header>

<!-- ================================================= -->
<!-- section formulaire contact -->
<!-- ================================================= -->
<section class="d-flex justify-content-center align-items-center pt-5">
    <div class="container mt-5 mb-3">
        <div class="row">
            <div class="col-lg-6">
                <img alt="Contact" class="img-fluid" src="../asset/img/404.webp">
            </div>
            <div class="col-lg-6">
                <h1 class="text-center mb-4">Contact</h1>
                <form action="#" id="contact-form" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="name">Nom</label>
                        <input class="form-control" id="name" name="nom" required type="text">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Adresse e-mail</label>
                        <input class="form-control" id="email" name="email" required type="email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="message">Message</label>
                        <textarea class="form-control" id="message" name="message" required rows="5"></textarea>
                    </div>
                    <button class="btn btn-success w-100" type="submit">Envoyer</button>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- ================================================= -->
<!-- Pied de page (Footer) -->
<!-- ================================================= -->
<footer class="py-4 text-bg-dark">
    <!-- ================================================= -->
    <!-- Import de footer.html -->
    <!-- ================================================= -->
</footer>

<!-- ================================================= -->
<!-- Inclusion des scripts Bootstrap et personnalisés -->
<!-- ================================================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../asset/js/app.js" type="module"></script>
</body>
</html>
