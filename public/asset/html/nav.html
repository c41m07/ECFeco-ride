<section class="modal fade" id="modalLogin" tabindex="-1" aria-labelledby="modalLoginLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalLoginLabel">Connexion à EcoRide</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
            </div>
            <div class="modal-body">
                <form id="">
                    <div class="mb-3">
                        <label for="emailLogin" class="form-label">Adresse e-mail</label>
                        <input type="email" class="form-control" id="emailLogin" required>
                    </div>
                    <div class="mb-3">
                        <label for="passwordLogin" class="form-label">Mot de passe</label>
                        <input type="password" class="form-control" id="passwordLogin" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100" id="login-form">Se connecter</button>
                </form>
            </div>
        </div>
    </div>
</section>
