<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Encodage des caractères -->
    <meta charset="UTF-8">

    <!-- Compatibilité avec Internet Explorer -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Rendre la page responsive sur mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Description pour le SEO -->
    <meta name="description" content="EcoRide est votre partenaire pour des déplacements écologiques, économiques et responsables. Rejoignez une communauté qui partage vos valeurs.">

    <!-- Mots-clés pour le SEO (optionnel : certains moteurs de recherche ne s'en servent plus) -->
    <meta name="keywords" content="EcoRide, déplacements écologiques, mobilité durable, voyage responsable">

    <!-- Meta Robots pour indiquer aux moteurs de recherche comment indexer la page -->
    <meta name="robots" content="index,follow">

    <!-- Couleur du thème pour certains navigateurs mobiles -->
    <meta name="theme-color" content="#ffffff">

    <!-- Open Graph pour le partage sur les réseaux sociaux -->
    <meta property="og:title" content="EcoRide - Voyager autrement">
    <meta property="og:description" content="EcoRide est votre partenaire pour des déplacements écologiques, économiques et responsables. Rejoignez une communauté qui partage vos valeurs.">
    <!-- lien vers le logo -->
    <meta property="og:image" content="../../public/asset/img/logo.png">
    <!-- URL du site -->
    <meta property="og:url" content="http://127.0.0.1:80/public/index.html">

    <!-- Favicon pour l'onglet du navigateur -->
    <link rel="icon" href="../asset/img/logo.png" type="image/x-icon">

    <!-- Titre de la page -->
    <title>EcoRide - Voyager autrement</title>

    <!-- Lien vers la police de caracteres Open Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Lien vers la librairie Bootstrap (CSS) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Lien vers la feuille de style personnalisée -->
    <link rel="stylesheet" href="../asset/css/styles.css">

    <!-- Lien vers Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<!-- ================================================= -->
<!-- Barre de navigation (Header) -->
<!-- ================================================= -->
<header>
    <!-- ================================================= -->
    <!-- Import de nav.html -->
    <!-- ================================================= -->
</header>

<!-- ================================================= -->
<!-- section formulaire contact -->
<!-- ================================================= -->
<section class="d-flex justify-content-center align-items-center pt-5">
    <div class="container mt-5 mb-3">
        <div class="row">
            <div class="col-lg-6">
                <img class="img-fluid" src="../asset/img/404.webp" alt="Contact">
            </div>
            <div class="col-lg-6">
                <h1 class="text-center mb-4">Contact</h1>
                <form action="#" method="post">
                    <div class="mb-3">
                        <label for="nom" class="form-label">Nom</label>
                        <input type="text" class="form-control" id="nom" name="nom" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Adresse e-mail</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Envoyer</button>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- ================================================= -->
<!-- Pied de page (Footer) -->
<!-- ================================================= -->
<footer class="py-4 text-bg-dark">
    <!-- ================================================= -->
    <!-- Import de footer.html -->
    <!-- ================================================= -->
</footer>

<!-- ================================================= -->
<!-- Inclusion des scripts Bootstrap et personnalisés -->
<!-- ================================================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../asset/js/main.js"></script>
</body>
</html>
